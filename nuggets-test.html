<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سعوديٌّ أصيل أم تشيكن ناجتس؟ 🍗</title>
<meta name="theme-color" content="#0a5c33">
<meta property="og:title" content="سعوديٌّ أصيل أم تشيكن ناجتس؟ 🍗">
<meta property="og:description" content="اختبارٌ يكشف مدى تجذُّرك في أصلك أم ميلك إلى الطابع المتغرِّب. أجِبْ عن المواقف واكتشف نتيجتك!">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=Cairo:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a1810; --surface:#102a1c; --card:#0d2417;
  --accent1:#0a5c33; --accent2:#2ea96a; --accent3:#07371f;
  --gold:#e8c468; --text:#eafff2; --muted:#8fb3a0;
  --line:rgba(255,255,255,.08);
  --nug:#e8a23c;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{scroll-behavior:smooth;}
body{font-family:'Tajawal',sans-serif;background:radial-gradient(120% 80% at 50% 0%,#11331f 0%,var(--bg) 60%);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:22px 16px 70px;}
.app{width:100%;max-width:480px;display:flex;flex-direction:column;align-items:center;gap:18px;}
.screen{display:none;width:100%;flex-direction:column;align-items:center;gap:18px;animation:fade .35s ease;}
.screen.active{display:flex;}
@keyframes fade{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}

/* ===== intro ===== */
.hero{text-align:center;padding-top:8px;}
.hero .emoji{font-size:3.6rem;line-height:1;filter:drop-shadow(0 6px 14px rgba(0,0,0,.4));}
.hero h1{font-family:'Cairo',sans-serif;font-size:2rem;font-weight:900;color:#fff;margin-top:10px;line-height:1.25;}
.hero h1 .vs{color:var(--nug);}
.hero p{color:var(--muted);font-size:1rem;margin-top:10px;line-height:1.6;}
.scale-bar{display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--muted);margin-top:6px;}
.scale-bar .line{flex:1;height:6px;border-radius:6px;background:linear-gradient(90deg,var(--accent2),var(--nug));}

.btn{width:100%;padding:15px;border-radius:14px;border:none;font-family:'Tajawal',sans-serif;font-size:1.05rem;font-weight:800;cursor:pointer;transition:transform .1s,opacity .2s;}
.btn:active{transform:scale(.97);}
.btn-green{background:linear-gradient(135deg,var(--accent2),var(--accent1));color:#fff;box-shadow:0 8px 22px rgba(10,92,51,.45);}
.btn-ghost{background:var(--surface);color:var(--text);border:1.5px solid var(--line);}

/* ===== progress ===== */
.progress-wrap{width:100%;display:flex;flex-direction:column;gap:8px;}
.progress-top{display:flex;justify-content:space-between;font-size:.85rem;color:var(--muted);font-weight:700;}
.progress-track{width:100%;height:10px;background:var(--surface);border-radius:10px;overflow:hidden;border:1px solid var(--line);}
.progress-fill{height:100%;width:0;border-radius:10px;background:linear-gradient(90deg,var(--accent2),var(--gold));transition:width .4s ease;}

/* ===== question ===== */
.q-card{width:100%;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:24px 20px;display:flex;flex-direction:column;gap:18px;}
.q-num{font-size:.8rem;color:var(--accent2);font-weight:800;letter-spacing:.5px;}
.q-text{font-family:'Cairo',sans-serif;font-size:1.45rem;font-weight:800;color:#fff;line-height:1.4;}
.options{display:flex;flex-direction:column;gap:12px;}
.opt{width:100%;text-align:right;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:16px 16px;color:var(--text);font-family:'Tajawal',sans-serif;font-size:1.05rem;font-weight:600;cursor:pointer;transition:border-color .15s,background .15s,transform .1s;display:flex;align-items:center;gap:12px;}
.opt:hover{border-color:var(--accent2);background:#143a25;}
.opt:active{transform:scale(.98);}
.opt .dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--muted);flex-shrink:0;transition:.15s;}
.opt.sel{border-color:var(--accent2);background:#16462c;}
.opt.sel .dot{border-color:var(--accent2);background:var(--accent2);box-shadow:inset 0 0 0 3px var(--card);}

.nav-row{display:flex;gap:10px;width:100%;}
.nav-row .btn{flex:1;}

/* ===== result ===== */
.result-card{width:100%;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:28px 22px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;}
.result-emoji{font-size:4.4rem;line-height:1;}
.result-title{font-family:'Cairo',sans-serif;font-size:1.9rem;font-weight:900;color:#fff;}
.meter{width:100%;margin:6px 0;}
.meter-labels{display:flex;justify-content:space-between;font-size:.82rem;font-weight:800;margin-bottom:8px;}
.meter-labels .s{color:var(--accent2);}
.meter-labels .n{color:var(--nug);}
.meter-track{width:100%;height:26px;border-radius:14px;background:linear-gradient(90deg,var(--nug) 0%,#6b5a2e 45%,#1d6e44 55%,var(--accent2) 100%);position:relative;overflow:visible;border:1px solid var(--line);}
.meter-knob{position:absolute;top:50%;width:34px;height:34px;border-radius:50%;background:#fff;transform:translate(-50%,-50%);display:flex;align-items:center;justify-content:center;font-size:1.1rem;box-shadow:0 4px 12px rgba(0,0,0,.5);transition:right 1s cubic-bezier(.2,.9,.3,1);}
.score-big{font-family:'Cairo',sans-serif;font-size:3rem;font-weight:900;color:var(--gold);line-height:1;}
.score-sub{color:var(--muted);font-size:.95rem;}
.result-desc{color:var(--text);font-size:1.05rem;line-height:1.7;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;width:100%;}
.share-row{display:flex;gap:10px;width:100%;}
.share-row .btn{flex:1;}
.footer{color:var(--muted);font-size:.8rem;text-align:center;margin-top:4px;}
</style>
</head>
<body>
<div class="app">

  <!-- INTRO -->
  <section class="screen active" id="screen-intro">
    <div class="hero">
      <div class="emoji">🍗⚖️🇸🇦</div>
      <h1>سعوديٌّ أصيل <span class="vs">أم</span> تشيكن ناجتس؟</h1>
      <p>اثنا عشر موقفًا تكشف حقيقتك: أما زلتَ متجذِّرًا في أصلك، أم مِلتَ إلى الطابع المتغرِّب؟<br>أجِبْ بصدقٍ ودون مجاملة 👀</p>
    </div>
    <div class="scale-bar">
      <span>أصيل 🇸🇦</span><span class="line"></span><span>متغرِّب 🍗</span>
    </div>
    <button class="btn btn-green" onclick="startQuiz()">لِنبدأ 🚀</button>
  </section>

  <!-- QUIZ -->
  <section class="screen" id="screen-quiz">
    <div class="progress-wrap">
      <div class="progress-top">
        <span id="prog-label">السؤال ١ من ١٢</span>
        <span id="prog-pct">0%</span>
      </div>
      <div class="progress-track"><div class="progress-fill" id="prog-fill"></div></div>
    </div>

    <div class="q-card">
      <div class="q-num" id="q-num">سؤال ١</div>
      <div class="q-text" id="q-text">…</div>
      <div class="options" id="options"></div>
    </div>

    <div class="nav-row">
      <button class="btn btn-ghost" id="btn-back" onclick="prevQ()">السابق</button>
      <button class="btn btn-green" id="btn-next" onclick="nextQ()" disabled>التالي</button>
    </div>
  </section>

  <!-- RESULT -->
  <section class="screen" id="screen-result">
    <div class="result-card" id="result-card">
      <div class="result-emoji" id="r-emoji">🍗</div>
      <div class="result-title" id="r-title">…</div>
      <div class="score-big" id="r-score">0%</div>
      <div class="score-sub" id="r-sub">على مقياس التغرُّب</div>

      <div class="meter">
        <div class="meter-labels"><span class="s">أصيل 🇸🇦</span><span class="n">🍗 متغرِّب</span></div>
        <div class="meter-track"><div class="meter-knob" id="r-knob">🙂</div></div>
      </div>

      <div class="result-desc" id="r-desc">…</div>
    </div>

    <div class="share-row">
      <button class="btn btn-green" onclick="shareResult()">📤 شارك نتيجتك</button>
    </div>
    <button class="btn btn-ghost" onclick="restart()">🔁 أعِد الاختبار</button>
    <div class="footer">اختبارٌ للتسلية فحسب — لا يُحدِّد هويتك حقًّا 😅</div>
  </section>

</div>

<script>
/* score: لكل خيار وزن من 0 (أصيل) إلى 2 (متغرّب).
   الخيارات مجرّدة ومخلوطة الترتيب عمدًا حتى لا تدلّ على وجهتها. */
const QUESTIONS = [
  { q:"ما الذي يمنحك الشعور بالطمأنينة أكثر؟",
    opts:[ ["أن تمتلك مساحتك الخاصة وخصوصيتك",2], ["أن تكون محاطًا بمن تعرفهم منذ الصغر",0], ["أن يكون يومك منظَّمًا ومتوقَّعًا",1] ] },
  { q:"عند اتخاذ قرار مهم، إلى أيِّ شيء تركن أولًا؟",
    opts:[ ["إلى تحليلك الخاص وبحثك المستقل",2], ["إلى رأي من هم أكبر منك سنًّا وخبرة",0], ["إلى إحساسك ومشورة أقرب الناس إليك",1] ] },
  { q:"كيف تنظر إلى الوقت؟",
    opts:[ ["موردٌ ثمين لا يُهدر، والمواعيد التزام",2], ["إطارٌ مرن، والعلاقات أهمُّ من الدقائق",0], ["أمرٌ أحاول ضبطه لكنه يفلت مني أحيانًا",1] ] },
  { q:"ما أقربُ تعريفٍ للكرم في نظرك؟",
    opts:[ ["أن تُعطي بما يليق من غير إسراف",2], ["أن تُعطي حين يُطلب منك فعلًا",1], ["أن تُعطي بلا حساب ولو فاض العطاء",0] ] },
  { q:"كيف ترى الضيافة المفاجئة دون موعد؟",
    opts:[ ["واجبٌ لا يُسأل عنه، والباب مفتوح دائمًا",0], ["مرحَّبٌ بها ما دامت لا تُثقل كاهلك",1], ["ألطفُ حين تكون بترتيبٍ وموعدٍ مسبق",2] ] },
  { q:"ما الذي يزعجك أكثر في تعامل الناس؟",
    opts:[ ["الإخلال بالمواعيد وعدم تقدير الوقت",2], ["التقصير في احترام الكبير والذوق العام",0], ["الفضول والتدخُّل فيما لا يعنيهم",1] ] },
  { q:"ما عطلتك المثالية؟",
    opts:[ ["لقاءٌ مفتوح تتّسع دائرته بلا تخطيط",0], ["هدوءٌ تستعيد فيه طاقتك بمفردك",1], ["رحلةٌ مدروسة بحجوزاتٍ وبرنامجٍ واضح",2] ] },
  { q:"حين يغمرك الفرح، مع من تتقاسمه؟",
    opts:[ ["مع دائرةٍ صغيرة مختارةٍ بعناية",2], ["مع العائلة الكبيرة كلِّها دون استثناء",0], ["أحتفظ به لنفسي في الغالب",1] ] },
  { q:"ما أهمُّ ما تُقدِّره في مكانٍ تأكل فيه؟",
    opts:[ ["وفرةُ الطعام وطِيبه ولو بسُط المكان",0], ["نظافتُه وسرعةُ خدمته",1], ["أناقتُه وذوقُ تقديمه",2] ] },
  { q:"كيف تصف علاقتك بتقاليدك وجذورك؟",
    opts:[ ["أحترمها وأنتقي منها ما يناسب حياتي",1], ["أساسُ هويتي وأحرص على توريثها لمن بعدي",0], ["جزءٌ من الماضي، وأتطلّع إلى ما هو أحدث",2] ] },
  { q:"عند أوّل مشكلة تواجهك، إلى من تلجأ؟",
    opts:[ ["أحاول حلَّها بنفسي قبل كلِّ شيء",2], ["إلى الأهل، فهم السَّنَد الأوّل",0], ["إلى صديقٍ أثق برأيه وحكمته",1] ] },
  { q:"ما الذي يصف ذوقك العام؟",
    opts:[ ["الحداثةُ والتجديد والطابع العالمي",2], ["البساطةُ والعملية",1], ["الأصالةُ والدفء وما اعتاد عليه الناس",0] ] },
];

let current=0;
const answers=new Array(QUESTIONS.length).fill(null);

const arNum=n=>n.toLocaleString('ar-EG');

function startQuiz(){
  show('screen-quiz');
  current=0;
  renderQ();
}

function show(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo({top:0,behavior:'smooth'});
}

function renderQ(){
  const item=QUESTIONS[current];
  const total=QUESTIONS.length;
  document.getElementById('q-num').textContent='سؤال '+arNum(current+1);
  document.getElementById('q-text').textContent=item.q;
  document.getElementById('prog-label').textContent='السؤال '+arNum(current+1)+' من '+arNum(total);
  const pct=Math.round((current)/total*100);
  document.getElementById('prog-pct').textContent=pct+'%';
  document.getElementById('prog-fill').style.width=pct+'%';

  const wrap=document.getElementById('options');
  wrap.innerHTML='';
  item.opts.forEach((o,i)=>{
    const b=document.createElement('button');
    b.className='opt'+(answers[current]===i?' sel':'');
    b.innerHTML='<span class="dot"></span><span>'+o[0]+'</span>';
    b.onclick=()=>selectOpt(i);
    wrap.appendChild(b);
  });

  document.getElementById('btn-back').style.visibility=current===0?'hidden':'visible';
  document.getElementById('btn-next').disabled=answers[current]===null;
  document.getElementById('btn-next').textContent=current===total-1?'شوف النتيجة 🎉':'التالي';
}

function selectOpt(i){
  answers[current]=i;
  document.querySelectorAll('#options .opt').forEach((el,idx)=>el.classList.toggle('sel',idx===i));
  document.getElementById('btn-next').disabled=false;
}

function nextQ(){
  if(answers[current]===null)return;
  if(current<QUESTIONS.length-1){ current++; renderQ(); }
  else showResult();
}
function prevQ(){ if(current>0){ current--; renderQ(); } }

function showResult(){
  let raw=0,max=0;
  answers.forEach((a,i)=>{ raw+=QUESTIONS[i].opts[a][1]; max+=2; });
  const pct=Math.round(raw/max*100); // 0 = سعودي أصيل ، 100 = نقتس كامل

  const tiers=[
    {min:0,  max:15, emoji:"🇸🇦",  title:"أصيلٌ عريق",             desc:"أصالتُك راسخة كالجذور. تُقدِّم العائلة والكرم واحترام الكبير على ما سواها، وتحمل تقاليدك بفخر. لا تتغيّر 🤝"},
    {min:16, max:35, emoji:"🌴",  title:"أصيلٌ بروحٍ معاصرة",      desc:"جذورك ثابتة، لكنك تواكب زمنك بذكاء. تنتقي من الحداثة ما يناسبك دون أن تفرِّط في هويتك. توازنٌ جميل 👌"},
    {min:36, max:55, emoji:"⚖️",  title:"متوازنٌ بين عالَمَين",   desc:"نِصفٌ وَنِصف! تتنقّل بسلاسة بين الأصالة والمعاصرة، وتتكيّف مع كل مجلسٍ ومقام. شخصيةٌ مرنة 😎"},
    {min:56, max:75, emoji:"🍟",  title:"أقربُ إلى الطابع المتغرِّب", desc:"مِلتَ كثيرًا نحو النمط العصري والعالمي، وإن بقيتْ فيك لمساتٌ من الأصل. لا بأس… أعِدْ بعض التوازن 😅"},
    {min:76, max:100,emoji:"🍗",  title:"تشيكن ناجتس خالص!",       desc:"الطابع العالمي يغلب على ذوقك وعاداتك من رأسك إلى أخمص قدميك. ربما حان وقت العودة قليلًا إلى الجذور 🥹"},
  ];
  const t=tiers.find(x=>pct>=x.min&&pct<=x.max)||tiers[2];

  document.getElementById('r-emoji').textContent=t.emoji;
  document.getElementById('r-title').textContent=t.title;
  document.getElementById('r-score').textContent=pct+'%';
  document.getElementById('r-sub').textContent='على مقياس التغرُّب 🍗';
  document.getElementById('r-desc').textContent=t.desc;

  // knob position: right=0% -> سعودي side (right), right=100% -> nuggets side (left)
  const knob=document.getElementById('r-knob');
  knob.textContent=t.emoji;
  knob.style.right=pct+'%';

  window._shareText='كانت نتيجتي "'+t.title+'" بنسبة '+pct+'% على مقياس التغرُّب 🍗 في اختبار "سعوديٌّ أصيل أم تشيكن ناجتس؟" — جرِّب أنت أيضًا!';
  show('screen-result');
}

async function shareResult(){
  const text=window._shareText||'جرِّب اختبار: سعوديٌّ أصيل أم تشيكن ناجتس؟ 🍗';
  const url=location.href;
  if(navigator.share){
    try{ await navigator.share({title:'سعوديٌّ أصيل أم تشيكن ناجتس؟',text,url}); return; }catch(e){}
  }
  try{
    await navigator.clipboard.writeText(text+'\n'+url);
    alert('تم نسخ النتيجة! الصقها حيث تشاء 📋');
  }catch(e){ alert(text); }
}

function restart(){ answers.fill(null); current=0; show('screen-intro'); }
</script>
</body>
</html>
